name: Build Android APK

on:
  push:
    branches: [ "claude/house-asymmetry-app-qr6f9w", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle wrapper
        working-directory: android-twa
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle-8.4-bin.zip
          # Use gradle wrapper bootstrap
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          exec gradle "$@"
          GRADLEW
          # Actually generate the wrapper properly
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: android-twa
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsig-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "FSIG Android App"
          body: |
            Latest APK build. Testers receive this automatically via Firebase App Distribution.

            **Direct download (backup):**
            ```
            https://github.com/acbrewer12/FSIG/releases/download/latest-apk/app-debug.apk
            ```
          files: android-twa/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: Distribute to testers via Firebase App Distribution
        if: github.event_name != 'pull_request' && env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: team
          file: android-twa/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "New build pushed to GitHub. Install via Firebase App Tester."
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: APK build summary
        run: |
          echo "### APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Testers in the **team** group will receive an email from Firebase App Distribution." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Direct download link (backup):**" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/acbrewer12/FSIG/releases/download/latest-apk/app-debug.apk" >> $GITHUB_STEP_SUMMARY
