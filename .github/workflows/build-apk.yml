name: Build Android APK

on:
  push:
    branches: [ "claude/house-asymmetry-app-qr6f9w", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle wrapper
        working-directory: android-twa
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle-8.4-bin.zip
          # Use gradle wrapper bootstrap
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          exec gradle "$@"
          GRADLEW
          # Actually generate the wrapper properly
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: android-twa
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsig-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK build summary
        run: |
          echo "### APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Debug APK is available as a workflow artifact." >> $GITHUB_STEP_SUMMARY
          echo "Download it from the Actions tab → this run → Artifacts section." >> $GITHUB_STEP_SUMMARY
