name: Build Android APK

on:
  push:
    branches: [ "claude/house-asymmetry-app-qr6f9w", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle wrapper
        working-directory: android-twa
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle-8.4-bin.zip
          # Use gradle wrapper bootstrap
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          exec gradle "$@"
          GRADLEW
          # Actually generate the wrapper properly
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: android-twa
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsig-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "FSIG Android App"
          body: |
            ## Download & Install

            1. Tap **app-debug.apk** below to download
            2. Open the file on your Android device
            3. Tap **Install** — if prompted, allow installs from unknown sources in Settings → Apps → Special access

            **Shareable direct link:**
            ```
            https://github.com/acbrewer12/FSIG/releases/download/latest-apk/app-debug.apk
            ```

            > App content updates automatically — you only need to reinstall when a new APK is published here.
          files: android-twa/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: APK build summary
        run: |
          echo "### APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Direct team download link:**" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/acbrewer12/FSIG/releases/download/latest-apk/app-debug.apk" >> $GITHUB_STEP_SUMMARY
